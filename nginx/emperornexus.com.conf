# =====================================================================
# EMPEROR NEXUS — PRODUCTION HOST NGINX VHOST (emperornexus.com)
# Isolated zones & upstream -> 127.0.0.1:3300 (Zero impact on co-tenants)
# =====================================================================

upstream emperor_nexus_backend {
    server 127.0.0.1:3300;
    keepalive 32;
}

# Dedicated isolated rate-limit & connection-limit zones
limit_req_zone $binary_remote_addr zone=emperor_nexus_otp:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=emperor_nexus_chat:10m rate=45r/m;
limit_req_zone $binary_remote_addr zone=emperor_nexus_general:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=emperor_nexus_conn:10m;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name emperornexus.com www.emperornexus.com;
    server_tokens off;

    # Bootstrap TLS certificate (seamless Cloudflare Full SSL & immediate HTTPS;
    # automatically upgraded in-place by Certbot once DNS points to 95.111.242.173)
    ssl_certificate     /etc/nginx/ssl/emperornexus-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/emperornexus-selfsigned.key;

    client_max_body_size 25M;

    # Return clean HTTP 429 Too Many Requests on rate/conn limit triggers
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn emperor_nexus_conn 40;

    # Hardened Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Trusted Cloudflare Proxy CIDRs (IPv4 & IPv6)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # ACME Let's Encrypt HTTP-01 Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 1. Strict Anti-Abuse Rate Limit on OTP & Auth Endpoints
    location ~* ^/api/auth/(otp|login|register) {
        limit_req zone=emperor_nexus_otp burst=8 nodelay;

        proxy_pass http://emperor_nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
    }

    # 2. Unbuffered Real-Time SSE Streaming (/api/public/chat/* & /api/realtime)
    location ~* ^/api/(public/chat/|realtime) {
        limit_req zone=emperor_nexus_chat burst=15 nodelay;

        proxy_pass http://emperor_nexus_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding on;

        # Credential protection: disable query-string credential logging on real-time SSE streams (SEC-02)
        access_log off;
    }

    # 3. Embeddable Chatbot Widget Asset (/widget.js)
    location = /widget.js {
        proxy_pass http://emperor_nexus_backend/widget.js;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        access_log off;
    }

    # 4. Health & Readiness Probe
    location = /api/health {
        proxy_pass http://emperor_nexus_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # 5. Next.js Immutable Static Assets
    location /_next/static/ {
        proxy_pass http://emperor_nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 6. General Application, Landing Page & Workspace Dashboard
    location / {
        limit_req zone=emperor_nexus_general burst=40 nodelay;

        proxy_pass http://emperor_nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
