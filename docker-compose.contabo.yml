name: emperor-nexus

networks:
  emperor_nexus_internal:
    name: emperor_nexus_internal
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: emperor-nexus-postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=60
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ess_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - emperor_nexus_pgdata:/var/lib/postgresql/data
    networks:
      - emperor_nexus_internal
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ess_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: emperor-nexus-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    networks:
      - emperor_nexus_internal
    mem_limit: 96m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emperor-nexus-app
    restart: unless-stopped
    ports:
      # Strictly bound to loopback for host Nginx reverse proxy
      - "127.0.0.1:3300:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=768
      - APP_URL=${APP_URL:-https://emperornexus.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://emperornexus.com}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ess_chatbot}?schema=public
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ess_chatbot}
      - DB_POOL_MAX=15
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_SECRET=${SESSION_SECRET}
      - OTP_SECRET=${OTP_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - OLLAMA_URL=http://ollama:11434
      - CHAT_MODEL=${CHAT_MODEL:-llama3.2:1b}
      - DLT_SMS_URI=${DLT_SMS_URI:-https://allsmssolution.in/sms-panel/api/http/index.php}
      - DLT_SMS_USERNAME=${DLT_SMS_USERNAME:-EMPEROR}
      - DLT_SMS_APIKEY=${DLT_SMS_APIKEY:-62CEF-9A446}
      - DLT_SMS_SENDER=${DLT_SMS_SENDER:-TXXTOO}
      - DLT_SMS_ROUTE=${DLT_SMS_ROUTE:-TRANS}
      - DLT_SMS_TEMPLATE_ID=${DLT_SMS_TEMPLATE_ID:-1607100000000313742}
      - DLT_SMS_ENTITY_ID=${DLT_SMS_ENTITY_ID:-1401805350000060162}
      - DLT_SMS_SIGNOFF=${DLT_SMS_SIGNOFF:-Team Nexus}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
      - LEAD_WEBHOOK_URL=${LEAD_WEBHOOK_URL:-}
      - LEAD_WEBHOOK_SECRET=${LEAD_WEBHOOK_SECRET:-}
    env_file:
      - .env
    volumes:
      - ./frontend/data:/app/data
    networks:
      - emperor_nexus_internal
    mem_limit: 1024m
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: emperor-nexus-ollama
    restart: unless-stopped
    networks:
      - emperor_nexus_internal
    mem_limit: 2560m
    cpus: 2.0
    volumes:
      - emperor_nexus_ollama:/root/.ollama

volumes:
  emperor_nexus_pgdata:
    name: emperor_nexus_pgdata
  emperor_nexus_ollama:
    name: emperor_nexus_ollama
