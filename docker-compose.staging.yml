name: ess-chatbot-staging

networks:
  ess_staging_internal:
    name: ess_staging_internal
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ess-postgres-staging
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ess_chatbot_staging}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgvector_staging_data:/var/lib/postgresql/data
    networks:
      - ess_staging_internal
    ports:
      # Bound strictly to loopback interface 127.0.0.1 for local staging testing
      - "127.0.0.1:${POSTGRES_PORT:-5499}:5432"
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ess_chatbot_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ess-redis-staging
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
    networks:
      - ess_staging_internal
    ports:
      # Bound strictly to loopback interface 127.0.0.1 for local staging testing
      - "127.0.0.1:${REDIS_PORT:-6389}:6379"
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ess-frontend-staging
    restart: unless-stopped
    ports:
      # Bound strictly to loopback interface 127.0.0.1 for host reverse proxy / test harness
      - "127.0.0.1:${FRONTEND_PORT:-3301}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - GIT_COMMIT=${GIT_COMMIT:-latest}
      - NODE_OPTIONS=--max-old-space-size=768
      - APP_URL=${APP_URL:-http://127.0.0.1:3301}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:3301}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ess_chatbot_staging}?schema=public
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ess_chatbot_staging}
      - DB_POOL_MAX=${DB_POOL_MAX:-25}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_SECRET=${SESSION_SECRET}
      - OTP_SECRET=${OTP_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEFAULT_AI_PROVIDER=mock
      - IS_LOAD_TEST=true
      - DLT_SMS_URI=http://mock-sms-service
      - DLT_SMS_APIKEY=MOCK_KEY_NO_CHARGES
      - AI_FAIL_CLOSED_ON_REDIS_OUTAGE=true
      - LEAD_WEBHOOK_URL=http://mock-webhook-receiver
      - LEAD_WEBHOOK_SECRET=mock_webhook_secret_staging
      - ALLOWED_ORIGINS=*
    volumes:
      # Staging uses a dedicated, isolated data directory
      - ./frontend/data-staging:/app/data
      - ./scripts:/app/scripts:ro
    networks:
      - ess_staging_internal
    mem_limit: 1536m
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  pgvector_staging_data:
    name: pgvector_staging_data
  redis_staging_data:
    name: redis_staging_data
